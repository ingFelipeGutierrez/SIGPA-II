<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SIGPA - Iniciar sesión</title>
    <link rel="stylesheet" href="css/comun.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-left">
            <div class="logo">🎓 SIGPA<small>Gestión de Prácticas Académicas</small></div>
            <p>Organiza, gestiona y realiza seguimiento a las prácticas académicas de manera fácil y eficiente.</p>
        </div>

        <div class="login-right">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para acceder a la plataforma.</p>

            <div class="login-error" id="login-error"></div>

            <div class="input-group">
                <label for="usuario">Usuario</label>
                <div class="input-wrap">
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
                    <button type="button" class="ver-clave" id="ver-clave" aria-label="Mostrar contraseña">👁️</button>
                </div>
            </div>

            <label class="remember"><input type="checkbox" id="recordarme"> Recordarme</label>

            <button class="login-button" id="boton-login" onclick="iniciarSesion()">Iniciar sesión</button>

            <div class="login-hint">
                <strong>Usuarios de prueba:</strong><br>
                estudiante / 123456 &nbsp;·&nbsp; docente / 123456 &nbsp;·&nbsp; director / 123456
            </div>
        </div>
    </div>

    <script src="js/comun.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
